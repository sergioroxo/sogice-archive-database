# Model configuration: the only place model names live (CLAUDE.md).
#
# Read by archive/config.py with a small built-in parser, so this file uses a
# plain YAML subset: nested "key: value" mappings indented with spaces,
# '#' comments, scalars (text, numbers, true/false, null, quoted strings) and
# one-line lists like [a, b]. No block lists ("- item"), anchors or
# multi-line strings. It stays valid YAML for any other tool.
#
# Tags confirmed with `ollama list` on the Mac Studio, 9 Nov 2026 (Ollama
# 0.40.3 server on 127.0.0.1). Digests and check results: docs/MODELS.md.
# Re-run scripts/check_models.py after changing anything here.
# One resident model at a time (64 GB): run roles in separate batches.
# num_predict caps output tokens on every reading call (never unlimited).

ollama:
  base_url: http://127.0.0.1:11434
  timeout_seconds: 600

roles:
  reading:
    model: gemma4:31b-mlx    # digest 637cc0ff1570; chosen by Sérgio 10 Nov (12B failed 15 test expectations, 31B 3)
    description: All reading, one structured call per section of about 6,000 characters
    temperature: 0
    num_predict: 4096
    num_ctx: 32768
    keep_alive: 10m          # stays loaded between sections of a batch; unloaded when the batch ends
    seconds_per_1000_chars: 15  # time budget; a source past 3x its budget is stopped (archive/read.py)
  reading_second:
    model: qwen3.8:27b-mlx   # digest 5642e97495e1; 27.8B dense; second reader (Sérgio, 10 Nov)
    description: Second, independent reading with the reading settings; reconciled with the first (archive/reconcile.py)
  audit:
    model: gemma4:31b-mlx    # digest 637cc0ff1570; hard cases and the audit pass
    description: Hard cases and the per-source audit verdict
    temperature: 0
    num_predict: 2048
    num_ctx: 32768
  # Trial roles: other models tried with the reading settings (read --model-role NAME, on a copy of the
  # database). Results: docs/MODELS.md. They are never used for stored readings.
  trial_gemma12b:
    model: gemma4:12b-mlx    # digest 117d0d84cf2a; the reading model until 10 Nov
    description: Trial only
  trial_qwen36_35b:
    model: qwen3.6:35b-mlx   # digest 1b50c6fdc2d4; 35.1B mixture of experts, nvfp4
    description: Trial only
  embedding:
    model: embeddinggemma-2:740m  # digest 969600645b52
    description: Search and attachment suggestions only, never evidence
    dimensions: 768
    modalities: [text, image, audio, video]  # video = frames + audio track; /api/embed rejects video
    context_tokens: 8192      # per input, enforced by the server (truncate off)
    max_audio_seconds: 300    # 330 s = 8,254 tokens fails; keep audio chunks <= 5 min
    video_frame_fps: 1
